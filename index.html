    <meta name="theme-color" content="#f7f7fb" />
    <!-- seo -->
    <style>
      /* Initial loader (ADR 0053, Figma «00 · Carga inicial»): shown until React renders into #root.
         Inline because the app CSS is not loaded yet; colors are the theme tokens. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #f7f7fb;
        opacity: 0;
        animation: boot-in 200ms ease-out 150ms forwards;
      }
      .boot-logo {
        width: 56px;
        height: 56px;
      }
      .boot-braid {
        display: flex;
        align-items: center;
      }
      .boot-thread {
        width: 16px;
        height: 2px;
        background: #e4e3ee;
      }
      .boot-diamond {
        width: 12px;
        height: 12px;
        fill: transparent;
        stroke: #b9b8cc;
        stroke-width: 1.5;
        animation: boot-step 1.4s ease-in-out infinite;
      }
      .boot-diamond:nth-of-type(2) {
        animation-delay: 0.1s;
      }
      .boot-diamond:nth-of-type(3) {
        animation-delay: 0.2s;
      }
      .boot-diamond:nth-of-type(4) {
        animation-delay: 0.3s;
      }
      .boot-diamond:nth-of-type(5) {
        animation-delay: 0.4s;
      }
      .boot-diamond:nth-of-type(6) {
        animation-delay: 0.5s;
      }
      .boot-diamond:nth-of-type(7) {
        animation-delay: 0.6s;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-step {
        0%,
        15% {
          fill: transparent;
          stroke: #b9b8cc;
        }
        35%,
        60% {
          fill: #5b47f0;
          stroke: #5b47f0;
        }
        85%,
        100% {
          fill: transparent;
          stroke: #b9b8cc;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot {
          animation: none;
          opacity: 1;
        }
        .boot-diamond {
          animation: none;
        }
      }
    </style>
  </head>
